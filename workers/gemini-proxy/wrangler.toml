name = "gotc-gemini-proxy"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Optional: own daily cap (shared for all users of this Worker).
# Create with: npx wrangler kv namespace create GOTC_USAGE
# Then uncomment and paste the id:
# [[kv_namespaces]]
# binding = "USAGE"
# id = "PASTE_KV_NAMESPACE_ID_HERE"

[vars]
# Comma-separated origins allowed to call this Worker (GitHub Pages + local).
ALLOWED_ORIGINS = "https://marksmangotc.github.io,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4173,http://127.0.0.1:4173"
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Soft daily cap before calling Gemini (0 = disabled; use KV binding USAGE above).
DAILY_IMAGE_LIMIT = "200"
